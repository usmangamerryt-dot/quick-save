<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Save</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f8fa;
  color:#222;
}
.header{
  background:#fff;
  padding:22px 18px;
  text-align:center;
  border-bottom:1px solid #eee;
  font-size:34px;
  font-weight:800;
  letter-spacing:-1px;
}
.header span{color:#58c900}
.hero{
  max-width:760px;
  margin:70px auto 30px;
  padding:0 18px;
  text-align:center;
}
h1{font-size:36px;margin:0 0 12px}
.subtitle{color:#666;font-size:17px;margin-bottom:30px}
.box{
  display:flex;
  background:#fff;
  border:5px solid #62d20b;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 8px 25px #00000010;
}
input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  padding:19px 16px;
  font-size:17px;
}
button{
  border:0;
  background:#62d20b;
  padding:0 28px;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#51b607}
.platforms{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin:28px 0;
}
.platforms span{
  background:#fff;
  border:1px solid #e5e5e5;
  padding:9px 15px;
  border-radius:20px;
  color:#555;
}
.note{
  max-width:650px;
  margin:30px auto;
  padding:18px;
  background:#fff;
  border-radius:12px;
  color:#666;
  font-size:14px;
  line-height:1.6;
}
footer{
  text-align:center;
  color:#999;
  padding:35px 15px;
}
@media(max-width:600px){
  .header{font-size:29px}
  h1{font-size:29px}
  .box{border-width:4px}
  input{font-size:15px;padding:17px 12px}
  button{padding:0 20px}
}
</style>
</head>
<body>

<div class="header">QUICK <span>SAVE</span></div>

<section class="hero">
  <h1>Video Downloader</h1>
  <div class="subtitle">Paste a video link below to continue</div>

  <div class="box">
    <input id="url" type="url" placeholder="Paste your video link here">
    <button onclick="startDownload()">➜</button>
  </div>

  <div class="platforms">
    <span>TikTok</span>
    <span>Instagram</span>
    <span>Facebook</span>
    <span>YouTube</span>
  </div>

  <div id="message" class="note">
    Quick Save is a front-end demo. Download processing needs a server/backend and should be used only for content you own or have permission to download.
  </div>
</section>

<footer>© 2026 Quick Save</footer>

<script>
function startDownload(){
  const url=document.getElementById("url").value.trim();
  const msg=document.getElementById("message");
  if(!url){
    msg.textContent="Please paste a video link first.";
    return;
  }
  msg.textContent="Link received. A download service/backend needs to be connected to process authorized downloads.";
}
</script>

</body>
</html>
